<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="三段机器人运动能力 Demo：感知行走、舞蹈倒地自恢复与足球射门。" />
  <title>Demo Motion Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <header class="topbar">
    <a class="brand" href="#top" aria-label="Demo Motion Lab 首页">
      <span class="brand-mark"></span>
      <span>MOTION / LAB</span>
    </a>
    <div class="top-meta"><span>03 DEMOS</span><span class="live-dot"></span><span>ONLINE</span></div>
  </header>

  <main id="top">
    <section class="showcase" id="showcase">
      <div class="section-heading">
        <p class="eyebrow">ROBOT MOTION DEMOS</p>
        <h1>运动能力展示</h1>
      </div>
      <div class="demo-grid">
      <article class="demo-card active" data-index="0">
        <div class="video-shell">
          <video src="perception-walk.mp4" muted loop playsinline preload="metadata"></video>
          <button class="play-btn" type="button" aria-label="播放感知行走视频">
            <span class="play-icon"></span><span class="play-label">PLAY FILM</span>
          </button>
          <div class="video-hud"><span>DEMO_01</span><span>PERCEPTION / LOCOMOTION</span></div>
        </div>
        <div class="card-copy">
          <div><span class="number">01</span><h2>感知行走</h2></div>
          <div class="tags"><span>PERCEPTION</span><span>LOCOMOTION</span></div>
        </div>
      </article>

      <article class="demo-card" data-index="1">
        <div class="video-shell">
          <video src="dance-recovery.mp4" muted loop playsinline preload="metadata"></video>
          <button class="play-btn" type="button" aria-label="播放舞蹈倒地自恢复视频">
            <span class="play-icon"></span><span class="play-label">PLAY FILM</span>
          </button>
          <div class="video-hud"><span>DEMO_02</span><span>BALANCE / RECOVERY</span></div>
        </div>
        <div class="card-copy">
          <div><span class="number">02</span><h2>舞蹈倒地自恢复</h2></div>
          <div class="tags"><span>BALANCE</span><span>RECOVERY</span></div>
        </div>
      </article>

      <article class="demo-card" data-index="2">
        <div class="video-shell">
          <video src="football-kick.mp4" muted loop playsinline preload="metadata"></video>
          <button class="play-btn" type="button" aria-label="播放足球射门视频">
            <span class="play-icon"></span><span class="play-label">PLAY FILM</span>
          </button>
          <div class="video-hud"><span>DEMO_03</span><span>TIMING / CONTROL</span></div>
        </div>
        <div class="card-copy">
          <div><span class="number">03</span><h2>足球射门</h2></div>
          <div class="tags"><span>TIMING</span><span>CONTROL</span></div>
        </div>
      </article>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
